<!DOCTYPE html>
<html lang="en">
<head>
  <title>Order Confirmation - Coffee Blend</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link href="https://fonts.googleapis.com/css?family=Poppins:300,400,500,600,700" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">

  <style>
    body {
      background: #1a1a1a;
      color: #fff;
      font-family: 'Poppins', sans-serif;
      margin: 0;
      padding: 0;
    }
    .confirmation-wrapper {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }
    .confirmation-box {
      max-width: 480px;
      width: 100%;
      background: #2a2a2a;
      border-radius: 20px;
      padding: 40px 30px;
      text-align: center;
      box-shadow: 0 15px 50px rgba(0,0,0,0.5);
    }
    .confirmation-box h2 {
      color: #c49b63;
      font-size: 28px;
      margin-bottom: 8px;
    }
    .subtitle {
      color: #aaa;
      font-size: 15px;
      margin-bottom: 25px;
    }
    .order-ref {
      background: #c49b63;
      color: #1a1a1a;
      font-weight: 700;
      padding: 14px 24px;
      border-radius: 10px;
      font-size: 17px;
      letter-spacing: 1px;
      display: inline-block;
      margin-bottom: 25px;
    }
    .qr-container {
      background: #ffffff;
      padding: 20px;
      border-radius: 16px;
      display: inline-block;
      margin-bottom: 20px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.3);
    }
    .qr-container img {
      width: 260px;
      height: 260px;
      display: block;
    }
    .scan-text {
      font-size: 15px;
      color: #ccc;
      margin-bottom: 25px;
      line-height: 1.5;
    }
    .order-details {
      text-align: left;
      background: #222;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 25px;
      font-size: 15px;
    }
    .order-details p {
      margin: 8px 0;
      display: flex;
      justify-content: space-between;
    }
    .order-details .total {
      color: #c49b63;
      font-size: 20px;
      font-weight: 600;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid #444;
    }
    .btn-paid {
      background: #c49b63;
      color: #1a1a1a;
      border: none;
      padding: 16px 30px;
      font-size: 16px;
      font-weight: 600;
      border-radius: 10px;
      cursor: pointer;
      width: 100%;
      transition: 0.3s;
    }
    .btn-paid:hover {
      background: #b38a52;
    }
    #payment-status {
      margin-top: 20px;
      font-size: 15px;
      min-height: 50px;
    }
    .pending { color: #ff9800; }
    .success { color: #4caf50; font-weight: 600; }
    .back-link {
      display: inline-block;
      margin-top: 25px;
      color: #c49b63;
      text-decoration: none;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <div class="confirmation-wrapper">
    <div class="confirmation-box">
      <h2>Scan to Pay</h2>
      <p class="subtitle">Unique QR Code generated for your order</p>

      <div class="order-ref" id="order-ref">ORDER-XXXXXX</div>

      <div class="qr-container">
        <img id="qr-image" src="" alt="PayMongo QR Ph">
      </div>

      <p class="scan-text">
        Scan using <strong>GCash, Maya, or any bank app</strong><br>
        that supports <strong>QR Ph</strong><br>
        <small>(QR expires in 30 minutes)</small>
      </p>

      <div class="order-details" id="order-details">
        <!-- filled by JS -->
      </div>

      <button class="btn-paid" onclick="checkStatus()">
        I Already Paid – Check Status
      </button>

      <div id="payment-status" class="pending">
        Waiting for payment...
      </div>

      <a href="checkout.html" class="back-link">← Back to Checkout</a>
    </div>
  </div>

<script>
  const orderData = JSON.parse(sessionStorage.getItem('paymongoOrder') || '{}');

  if (!orderData.qr_image_url) {
    document.body.innerHTML = '<div style="color:white;text-align:center;padding:100px;">No order found. <a href="checkout.html" style="color:#c49b63;">Go back to checkout</a></div>';
  } else {
    document.getElementById('order-ref').textContent = orderData.order_ref;
    document.getElementById('qr-image').src = orderData.qr_image_url;

    document.getElementById('order-details').innerHTML = `
      <p><span>Customer</span> <strong>${orderData.name}</strong></p>
      <p><span>Email</span> <span>${orderData.email}</span></p>
      <p><span>Phone</span> <span>${orderData.phone}</span></p>
      <p><span>Item</span> <span>Coffee Blend Special × ${orderData.quantity}</span></p>
      <p class="total"><span>Total Amount</span> <span>₱${orderData.amount}</span></p>
    `;
  }

  async function checkStatus() {
    const statusEl = document.getElementById('payment-status');
    statusEl.innerHTML = '<span class="pending">Checking payment status...</span>';
    if (!orderData.payment_intent_id) {
      statusEl.innerHTML = '<div class="pending">No payment intent on this order.</div>';
      return;
    }
    try {
      const res = await fetch('https://intern7zsa-github-com.vercel.app/api/check-payment?id=' + encodeURIComponent(orderData.payment_intent_id));
      const data = await res.json();
      if (data.paid || data.status === 'succeeded') {
        statusEl.innerHTML = '<div style="color:#51cf66;font-weight:600;">Payment received! Thank you.</div>';
        try { localStorage.removeItem('coffeeBlendCart'); } catch(e) {}
        // Notify shop owner by email (Gmail / OWNER_EMAIL in config.php)
        try {
          fetch('notify-sale.php', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              name: orderData.name || '',
              email: orderData.email || '',
              phone: orderData.phone || '',
              amount: orderData.amount || '',
              order_ref: orderData.order_ref || '',
              payment_intent_id: orderData.payment_intent_id || '',
              quantity: orderData.quantity || 1
            })
          }).catch(function(){});
        } catch (e) {}
        setTimeout(function(){ window.location.href = 'Success.html'; }, 1500);
      } else {
        statusEl.innerHTML = '<div class="pending">Status: <strong>' + (data.status || 'pending') +
          '</strong><br>Scan the QR with GCash / Maya / bank app, then check again.<br>Ref: <strong style="color:#c49b63">' +
          (orderData.order_ref || '') + '</strong></div>';
      }
    } catch (err) {
      statusEl.innerHTML = '<div class="pending">Could not reach server. Try again shortly.</div>';
    }
  }
</script>

</body>
</html>
