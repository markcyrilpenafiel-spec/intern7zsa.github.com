<!DOCTYPE html>
<html lang="en">
<head>
  <title>Order Confirmation - Coffee Blend</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://fonts.googleapis.com/css?family=Poppins:300,400,500,600,700" rel="stylesheet">
  <style>
    body {
      background: #1a1a1a;
      color: #fff;
      font-family: 'Poppins', sans-serif;
      margin: 0;
      padding: 0;
    }
    .confirmation-wrapper {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }
    .confirmation-box {
      max-width: 480px;
      width: 100%;
      background: #2a2a2a;
      border-radius: 20px;
      padding: 40px 30px;
      text-align: center;
      box-shadow: 0 15px 50px rgba(0,0,0,0.5);
    }
    .confirmation-box h2 {
      color: #c49b63;
      font-size: 28px;
      margin-bottom: 8px;
    }
    .subtitle {
      color: #aaa;
      font-size: 15px;
      margin-bottom: 25px;
    }
    .order-ref {
      background: #c49b63;
      color: #1a1a1a;
      font-weight: 700;
      padding: 14px 24px;
      border-radius: 10px;
      font-size: 17px;
      letter-spacing: 1px;
      display: inline-block;
      margin-bottom: 25px;
    }
    .qr-container {
      background: #ffffff;
      padding: 20px;
      border-radius: 16px;
      display: inline-block;
      margin-bottom: 20px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.3);
    }
    .qr-container img {
      width: 260px;
      height: 260px;
      display: block;
    }
    .scan-text {
      font-size: 15px;
      color: #ccc;
      margin-bottom: 25px;
      line-height: 1.5;
    }
    .order-details {
      text-align: left;
      background: #222;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 25px;
      font-size: 15px;
    }
    .order-details p {
      margin: 8px 0;
      display: flex;
      justify-content: space-between;
      gap: 12px;
    }
    .order-details .total {
      color: #c49b63;
      font-size: 20px;
      font-weight: 600;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid #444;
    }
    #payment-status {
      margin: 20px 0;
      font-size: 15px;
      min-height: 48px;
      line-height: 1.5;
    }
    .pending { color: #f0ad4e; }
    .success { color: #51cf66; font-weight: 600; }
    .expired { color: #ff6b6b; }
    .back-link {
      display: inline-block;
      margin-top: 15px;
      color: #c49b63;
      text-decoration: none;
      font-size: 14px;
    }
    .back-link:hover { text-decoration: underline; }
    .spinner {
      display: inline-block;
      width: 18px;
      height: 18px;
      border: 2px solid rgba(240,173,78,0.3);
      border-top-color: #f0ad4e;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      vertical-align: middle;
      margin-right: 8px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="confirmation-wrapper">
    <div class="confirmation-box">
      <h2>Scan to Pay</h2>
      <p class="subtitle">Unique QR Code generated for your order</p>
      <div class="order-ref" id="order-ref">ORDER-XXXXXX</div>
      <div class="qr-container">
        <img id="qr-image" src="" alt="PayMongo QR Ph">
      </div>
      <p class="scan-text">
        Scan using <strong>GCash, Maya, or any bank app</strong><br>
        that supports <strong>QR Ph</strong><br>
        <small>(QR expires in 30 minutes)</small>
      </p>
      <div class="order-details" id="order-details"></div>
      <div id="payment-status" class="pending">
        <span class="spinner"></span> Waiting for payment...
      </div>
      <a href="checkout.html" class="back-link">← Back to Checkout</a>
    </div>
  </div>

<script>
  const orderData = JSON.parse(sessionStorage.getItem('paymongoOrder') || '{}');

  if (!orderData.qr_image_url || !orderData.payment_intent_id) {
    document.body.innerHTML = `
      <div style="color:white;text-align:center;padding:100px 20px;font-family:Poppins,sans-serif;">
        <h2 style="color:#c49b63;margin-bottom:16px;">No order found</h2>
        <p style="color:#aaa;margin-bottom:30px;">Please go back and place your order again.</p>
        <a href="checkout.html" style="color:#c49b63;text-decoration:none;font-weight:600;">
          ← Go back to checkout
        </a>
      </div>`;
  } else {
    document.getElementById('qr-image').src = orderData.qr_image_url;
    document.getElementById('order-ref').textContent =
      orderData.order_ref || ('ORDER-' + Date.now());

    let itemsHtml = '';
    if (orderData.items && Array.isArray(orderData.items) && orderData.items.length) {
      orderData.items.forEach(function (item) {
        const lineTotal = (Number(item.price) * Number(item.quantity)).toFixed(2);
        itemsHtml +=
          '<p><span>' + item.name + ' × ' + item.quantity + '</span><span>₱' + lineTotal + '</span></p>';
      });
    }

    document.getElementById('order-details').innerHTML =
      '<p><span>Customer</span><span>' + (orderData.name || '-') + '</span></p>' +
      '<p><span>Email</span><span>' + (orderData.email || '-') + '</span></p>' +
      '<p><span>Phone</span><span>' + (orderData.phone || '-') + '</span></p>' +
      itemsHtml +
      '<p class="total"><span>Total Amount</span><span>₱' +
      Number(orderData.amount || 0).toFixed(2) + '</span></p>';

    const statusEl = document.getElementById('payment-status');
    let pollCount = 0;
    const maxPolls = 72;
    let pollingStopped = false;

    async function checkPaymentStatus() {
      if (pollingStopped) return true;

      try {
        const res = await fetch(
          'https://intern7zsa-github-com.vercel.app/api/check-payment?id=' +
          encodeURIComponent(orderData.payment_intent_id)
        );
        if (!res.ok) throw new Error('Network response was not ok');

        const data = await res.json();

        if (data.paid === true || data.status === 'succeeded') {
          pollingStopped = true;
          statusEl.className = 'success';
          statusEl.innerHTML = '✅ Payment received! Sending confirmation email...';

          try {
            await fetch('https://intern7zsa-github-com.vercel.app/api/notify-sale', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                payment_intent_id: orderData.payment_intent_id,
                name: orderData.name,
                email: orderData.email,
                phone: orderData.phone,
                amount: orderData.amount,
                order_ref: orderData.order_ref,
                quantity: orderData.quantity || (orderData.items ? orderData.items.length : 1)
              })
            });
          } catch (e) {
            console.error('Email notify failed:', e);
          }

          localStorage.removeItem('coffeeBlendCart');
          sessionStorage.removeItem('paymongoOrder');

          statusEl.innerHTML = '✅ Payment received! Redirecting...';
          setTimeout(function () {
            window.location.href = 'success.html';
          }, 1200);

          return true;
        }

        statusEl.className = 'pending';
        statusEl.innerHTML =
          '<span class="spinner"></span> Waiting for payment...<br>' +
          '<small>Scan the QR with GCash / Maya</small>';
        return false;
      } catch (err) {
        console.error('Payment check error:', err);
        statusEl.className = 'pending';
        statusEl.innerHTML =
          '<span class="spinner"></span> Checking payment status...';
        return false;
      }
    }

    setTimeout(async function () {
      const paid = await checkPaymentStatus();
      if (paid) return;

      const interval = setInterval(async function () {
        pollCount++;
        const paidNow = await checkPaymentStatus();
        if (paidNow || pollCount >= maxPolls) {
          clearInterval(interval);
          pollingStopped = true;
          if (!paidNow) {
            statusEl.className = 'expired';
            statusEl.innerHTML =
              'QR expired or payment not received.<br>' +
              '<a href="checkout.html" style="color:#c49b63;">Try again</a>';
          }
        }
      }, 5000);
    }, 2000);
  }
</script>
</body>
</html>
