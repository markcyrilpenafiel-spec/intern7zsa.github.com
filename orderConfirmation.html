<!DOCTYPE html>
<html lang="en">
<head>
  <title>Order Confirmation - Coffee Blend</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link href="https://fonts.googleapis.com/css?family=Poppins:300,400,500,600,700" rel="stylesheet">

  <style>
    body {
      background: #1a1a1a;
      color: #fff;
      font-family: 'Poppins', sans-serif;
      margin: 0;
      padding: 0;
    }
    .confirmation-wrapper {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }
    .confirmation-box {
      max-width: 480px;
      width: 100%;
      background: #2a2a2a;
      border-radius: 20px;
      padding: 40px 30px;
      text-align: center;
      box-shadow: 0 15px 50px rgba(0,0,0,0.5);
    }
    .confirmation-box h2 {
      color: #c49b63;
      font-size: 28px;
      margin-bottom: 8px;
    }
    .subtitle {
      color: #aaa;
      font-size: 15px;
      margin-bottom: 25px;
    }
    .order-ref {
      background: #c49b63;
      color: #1a1a1a;
      font-weight: 700;
      padding: 14px 24px;
      border-radius: 10px;
      font-size: 17px;
      letter-spacing: 1px;
      display: inline-block;
      margin-bottom: 25px;
    }
    .qr-container {
      background: #ffffff;
      padding: 20px;
      border-radius: 16px;
      display: inline-block;
      margin-bottom: 20px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.3);
    }
    .qr-container img {
      width: 260px;
      height: 260px;
      display: block;
    }
    .scan-text {
      font-size: 15px;
      color: #ccc;
      margin-bottom: 25px;
      line-height: 1.5;
    }
    .order-details {
      text-align: left;
      background: #222;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 25px;
      font-size: 15px;
    }
    .order-details p {
      margin: 8px 0;
      display: flex;
      justify-content: space-between;
    }
    .order-details .total {
      color: #c49b63;
      font-size: 20px;
      font-weight: 600;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid #444;
    }
    #payment-status {
      margin: 20px 0;
      font-size: 15px;
      min-height: 24px;
    }
    .pending {
      color: #f0ad4e;
    }
    .success {
      color: #51cf66;
      font-weight: 600;
    }
    .back-link {
      display: inline-block;
      margin-top: 15px;
      color: #c49b63;
      text-decoration: none;
      font-size: 14px;
    }
    .back-link:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="confirmation-wrapper">
    <div class="confirmation-box">
      <h2>Scan to Pay</h2>
      <p class="subtitle">Unique QR Code generated for your order</p>

      <div class="order-ref" id="order-ref">ORDER-XXXXXX</div>

      <div class="qr-container">
        <img id="qr-image" src="" alt="PayMongo QR Ph">
      </div>

      <p class="scan-text">
        Scan using <strong>GCash, Maya, or any bank app</strong><br>
        that supports <strong>QR Ph</strong><br>
        <small>(QR expires in 30 minutes)</small>
      </p>

      <div class="order-details" id="order-details">
        <!-- filled by JS -->
      </div>

      <!-- Status message (no button) -->
      <div id="payment-status" class="pending">
        Waiting for payment...
      </div>

      <a href="checkout.html" class="back-link">← Back to Checkout</a>
    </div>
  </div>

<script>
  const orderData = JSON.parse(sessionStorage.getItem('paymongoOrder') || '{}');

  if (!orderData.qr_image_url || !orderData.payment_intent_id) {
    document.body.innerHTML = `
      <div style="color:white;text-align:center;padding:100px;font-family:Poppins,sans-serif;">
        No order found.<br><br>
        <a href="checkout.html" style="color:#c49b63;">Go back to checkout</a>
      </div>`;
  } else {
    // Fill order details
    document.getElementById('qr-image').src = orderData.qr_image_url;
    document.getElementById('order-ref').textContent = orderData.order_ref || 'ORDER-' + Date.now();

    let itemsHtml = '';
    if (orderData.items && orderData.items.length) {
      orderData.items.forEach(item => {
        itemsHtml += `<p><span>${item.name} × ${item.quantity}</span><span>₱${(item.price * item.quantity).toFixed(2)}</span></p>`;
      });
    }

    document.getElementById('order-details').innerHTML = `
      <p><span>Customer</span><span>${orderData.name || '-'}</span></p>
      <p><span>Email</span><span>${orderData.email || '-'}</span></p>
      <p><span>Phone</span><span>${orderData.phone || '-'}</span></p>
      ${itemsHtml}
      <p class="total"><span>Total Amount</span><span>₱${orderData.amount || '0.00'}</span></p>
    `;
  }

  // ========== AUTO CHECK PAYMENT (no button) ==========
  async function checkPaymentStatus() {
    const statusEl = document.getElementById('payment-status');

    try {
      const res = await fetch(
        'https://intern7zsa-github-com.vercel.app/api/check-payment?id=' +
        encodeURIComponent(orderData.payment_intent_id)
      );

      const data = await res.json();

      if (data.paid || data.status === 'succeeded') {
        // Customer already paid → redirect to S
        
        uccess
        statusEl.className = 'success';
        statusEl.innerHTML = 'Payment received! Redirecting...';

        // Clear cart
        localStorage.removeItem('coffeeBlendCart');
        sessionStorage.removeItem('paymongoOrder');

        // Redirect after short delay
        setTimeout(() => {
          window.location.href = 'success.html';
        }, 1200);

        return true; // stop polling
      } else {
        statusEl.className = 'pending';
        statusEl.innerHTML = 'Waiting for payment...<br><small>Scan the QR with GCash / Maya</small>';
        return false;
      }
    } catch (err) {
      statusEl.className = 'pending';
      statusEl.innerHTML = 'Checking payment status...';
      return false;
    }
  }

  // Start automatic checking
  let pollCount = 0;
  const maxPolls = 72; // 6 minutes (72 × 5 seconds)

  // Check immediately after 2 seconds
  setTimeout(async () => {
    const paid = await checkPaymentStatus();
    if (paid) return;

    // Then check every 5 seconds
    const interval = setInterval(async () => {
      pollCount++;
      const paid = await checkPaymentStatus();

      if (paid || pollCount >= maxPolls) {
        clearInterval(interval);
        if (!paid) {
          document.getElementById('payment-status').innerHTML =
            'QR expired or payment not received.<br><a href="checkout.html" style="color:#c49b63;">Try again</a>';
        }
      }
    }, 5000);
  }, 2000);
</script>

</body>
</html>
