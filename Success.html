<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payment Successful - Coffee Blend</title>

  <link href="https://fonts.googleapis.com/css?family=Poppins:300,400,500,600,700" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css?family=Josefin+Sans:400,700" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/icomoon.css">

  <style>
    body {
      background-color: #1a1a1a;
      color: #fff;
      font-family: 'Poppins', sans-serif;
    }
    .success-container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px 20px;
    }
    .success-box {
      background: #2a2a2a;
      border-radius: 16px;
      padding: 50px 40px;
      max-width: 520px;
      width: 100%;
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
    }
    .success-icon {
      font-size: 80px;
      color: #28a745;
      margin-bottom: 20px;
    }
    .success-box h1 {
      font-size: 32px;
      font-weight: 600;
      margin-bottom: 15px;
      color: #fff;
    }
    .success-box p {
      color: #ccc;
      font-size: 16px;
      line-height: 1.6;
      margin-bottom: 30px;
    }
    .order-info {
      background: #333;
      border-radius: 10px;
      padding: 20px;
      margin-bottom: 30px;
      text-align: left;
    }
    .order-info p {
      margin: 8px 0;
      font-size: 15px;
      color: #ddd;
    }
    .btn-home {
      background: #c49b63;
      border: none;
      color: #fff;
      padding: 14px 40px;
      font-size: 16px;
      border-radius: 50px;
      text-decoration: none;
      display: inline-block;
      transition: all 0.3s ease;
    }
    .btn-home:hover {
      background: #a67c4a;
      color: #fff;
      text-decoration: none;
      transform: translateY(-2px);
    }
    .btn-secondary {
      background: transparent;
      border: 2px solid #c49b63;
      color: #c49b63;
      padding: 12px 35px;
      font-size: 15px;
      border-radius: 50px;
      text-decoration: none;
      display: inline-block;
      margin-left: 10px;
      transition: all 0.3s ease;
    }
    .btn-secondary:hover {
      background: #c49b63;
      color: #fff;
      text-decoration: none;
    }
  </style>
</head>
<body>

  <div class="success-container">
    <div class="success-box">
      
      <!-- Success Icon -->
      <div class="success-icon">
        <span class="icon-check"></span>
        <!-- Fallback if icon font fails -->
        <span style="font-size: 80px;">✅</span>
      </div>

      <h1>Payment Successful!</h1>
      
      <p>
        Thank you for your order.<br>
        Your payment has been received and we are now preparing your coffee.
      </p>

      <!-- Order Summary Box -->
      <div class="order-info">
        <p><strong>Status:</strong> <span style="color:#28a745;">Paid</span></p>
        <p><strong>Payment Method:</strong> PayMongo (QR / GCash / Maya / Card)</p>
        <p><strong>Order Date:</strong> <span id="order-date"></span></p>
        <p style="margin-top:15px; font-size:14px; color:#aaa;">
          A confirmation has been sent to your email (if provided).
        </p>
      </div>

      <div>
        <a href="index.html" class="btn-home">Back to Home</a>
        <a href="menu.html" class="btn-secondary">View Menu</a>
      </div>

    </div>
  </div>

  <script>
    // Show current date
    const dateEl = document.getElementById('order-date');
    const options = { year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit' };
    dateEl.textContent = new Date().toLocaleDateString('en-PH', options);
  </script>

</body>
</html>
