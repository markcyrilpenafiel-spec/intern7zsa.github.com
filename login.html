<!DOCTYPE html>
<html lang="en">
<head>
  <title>Login – Rene Coffee</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <link href="https://fonts.googleapis.com/css?family=Poppins:300,400,500,600,700" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css?family=Josefin+Sans:400,700" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css?family=Great+Vibes" rel="stylesheet">
  <link rel="stylesheet" href="css/open-iconic-bootstrap.min.css">
  <link rel="stylesheet" href="css/animate.css">
  <link rel="stylesheet" href="css/owl.carousel.min.css">
  <link rel="stylesheet" href="css/owl.theme.default.min.css">
  <link rel="stylesheet" href="css/magnific-popup.css">
  <link rel="stylesheet" href="css/aos.css">
  <link rel="stylesheet" href="css/ionicons.min.css">
  <link rel="stylesheet" href="css/bootstrap-datepicker.css">
  <link rel="stylesheet" href="css/jquery.timepicker.css">
  <link rel="stylesheet" href="css/flaticon.css">
  <link rel="stylesheet" href="css/icomoon.css">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .auth-wrap { min-height: 70vh; display:flex; align-items:center; padding: 80px 0 40px; }
    .auth-card {
      background: #1a1a1a; border: 1px solid #333; border-radius: 12px;
      padding: 40px 32px; max-width: 420px; margin: 0 auto; color: #fff;
    }
    .auth-card h2 { font-family: 'Josefin Sans', sans-serif; color: #c49b63; margin-bottom: 8px; }
    .auth-card .sub { color: #aaa; margin-bottom: 28px; font-size: 14px; }
    .auth-card label { display:block; margin-bottom: 6px; font-size: 13px; color: #ccc; }
    .auth-card input {
      width: 100%; padding: 12px 14px; margin-bottom: 16px; border-radius: 6px;
      border: 1px solid #444; background: #111; color: #fff;
    }
    .auth-card input:focus { outline: none; border-color: #c49b63; }
    .btn-auth {
      width: 100%; padding: 14px; border: none; border-radius: 6px;
      background: #c49b63; color: #111; font-weight: 600; cursor: pointer;
      transition: background .2s;
    }
    .btn-auth:hover { background: #b08a52; }
    .btn-auth:disabled { opacity: .6; cursor: not-allowed; }
    .auth-links { margin-top: 18px; text-align: center; font-size: 14px; }
    .auth-links a { color: #c49b63; }
    #auth-msg { margin-top: 12px; font-size: 14px; min-height: 20px; }
    .text-err { color: #ff6b6b; }
    .text-ok { color: #51cf66; }
  </style>
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark ftco_navbar bg-dark ftco-navbar-light" id="ftco-navbar">
    <div class="container">
      <a class="navbar-brand" href="index.html">Coffee<small>Blend</small></a>
      <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#ftco-nav">
        <span class="oi oi-menu"></span> Menu
      </button>
      <div class="collapse navbar-collapse" id="ftco-nav">
        <ul class="navbar-nav ml-auto">
          <li class="nav-item"><a href="index.html" class="nav-link">Home</a></li>
          <li class="nav-item"><a href="menu.html" class="nav-link">Menu</a></li>
          <li class="nav-item"><a href="shop.html" class="nav-link">Shop</a></li>
          <li class="nav-item active"><a href="login.html" class="nav-link">Login</a></li>
          <li class="nav-item cart">
            <a href="cart.html" class="nav-link">
              <span class="icon icon-shopping_cart"></span>
              <span class="bag d-flex justify-content-center align-items-center"><small id="cart-count">0</small></span>
            </a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <section class="auth-wrap">
    <div class="container">
      <div class="auth-card">
        <h2>Welcome back</h2>
        <p class="sub">Sign in to checkout and track your orders</p>
        <form id="login-form">
          <label for="email">Email</label>
          <input type="email" id="email" required autocomplete="email" placeholder="you@email.com">
          <label for="password">Password</label>
          <input type="password" id="password" required autocomplete="current-password" placeholder="••••••••" minlength="6">
          <button type="submit" class="btn-auth" id="btn-login">Login</button>
        </form>
        <div id="auth-msg"></div>
        <div class="auth-links">
          <a href="forgot-password.html">Forgot password?</a><br><br>
          New here? <a href="signup.html">Create an account</a>
        </div>
      </div>
    </div>
  </section>

  <footer class="ftco-footer ftco-section img">
    <div class="container">
      <div class="row">
        <div class="col-md-12 text-center">
          <p>Copyright &copy;<script>document.write(new Date().getFullYear());</script> Coffee Blend</p>
        </div>
      </div>
    </div>
  </footer>

  <script src="js/jquery.min.js"></script>
  <script src="js/bootstrap.min.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/auth.js"></script>
  <script>
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('btn-login');
      const msg = document.getElementById('auth-msg');
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      btn.disabled = true;
      btn.textContent = 'Signing in...';
      msg.textContent = '';
      try {
        if (!window.FIREBASE_ENABLED) {
          throw new Error('Firebase is not configured yet. Open js/firebase-config.js and paste your Firebase web config, then set FIREBASE_ENABLED = true.');
        }
        const user = await CoffeeAuth.login(email, password);
        msg.className = 'text-ok';
        if (user && !user.emailVerified) {
          msg.textContent = 'Logged in. Please verify your email to continue to checkout…';
          // Keep intended destination (e.g. checkout) and send to verify page
          const dest = sessionStorage.getItem('coffeeBlendAuthRedirect') || 'checkout.html';
          sessionStorage.setItem('coffeeBlendAuthRedirect', dest);
          setTimeout(() => { window.location.href = 'verify-email.html'; }, 900);
          return;
        }
        msg.textContent = 'Success! Redirecting…';
        window.location.href = CoffeeAuth.getRedirect();
      } catch (err) {
        msg.className = 'text-err';
        msg.textContent = err.message || 'Login failed';
        btn.disabled = false;
        btn.textContent = 'Login';
      }
    });
  </script>
</body>
</html>
